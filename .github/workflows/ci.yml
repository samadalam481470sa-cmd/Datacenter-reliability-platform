name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python -m build --wheel
      - name: Audit installed dependencies against the OSV database
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit --skip-editable --progress-spinner off

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan history for committed credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: docker compose up -d --build
      - name: Exercise live REST endpoints
        run: |
          python - <<'PY'
          import json, time
          from urllib.request import urlopen
          host = 'http://127.0.0.1:8000'
          for _ in range(40):
              try:
                  with urlopen(host+'/health', timeout=3) as r:
                      assert json.load(r)['status'] == 'ok'
                  with urlopen(host+'/api/v1/overview', timeout=3) as r:
                      assert json.load(r)['kpis']['rack_count'] == 48
                  with urlopen(host+'/api/v1/scenario?zone=Z02&cooling_drop_pct=50', timeout=3) as r:
                      assert 'estimated_peak_inlet_c' in json.load(r)
                  with urlopen(host+'/', timeout=3) as r:
                      assert 'Rack thermal map' in r.read().decode()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('RackHelm smoke failed')
          PY
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
